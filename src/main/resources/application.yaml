spring:
  application:
    name: springbootdemo

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    database: postgresql
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true